<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow of Death | Community</title>
  <meta name="description" content="Shadow of Death: a 718 RuneScape private server. Forums, community posts and live chat with friends.">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="icon" href="img/favicon-crowned-16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="img/favicon-crowned-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="img/favicon-crowned-64.png" type="image/png" sizes="64x64">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cinematic.css">
</head>
<body>
  <div id="demo-banner" hidden>DEMO MODE: accounts, posts and messages are saved in this browser only. Follow <b>SETUP GUIDE.html</b> to go live.</div>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="logo"><img src="img/cinematic/wordmark-client.png" alt="Shadow of Death"></a>
      <nav id="nav"></nav>
      <div id="userbox" class="userbox"></div>
    </div>
  </header>

  <main id="view" class="container"><div class="loading"><span class="spinner"></span></div></main>

  <footer class="footer">
    <div class="container footer-inner">
      <a class="footer-brand" href="#/">
        <img class="footer-knight" src="img/cinematic/footer-shadow-knight.png"
          srcset="img/cinematic/footer-shadow-knight.png 1449w, img/cinematic/footer-shadow-knight-4k.png 3840w"
          sizes="(max-width: 700px) min(92vw, 420px), min(45vw, 520px)"
          alt="" width="1449" height="1086" loading="lazy">
        <img class="footer-wordmark" src="img/cinematic/wordmark-client.png" alt="Shadow of Death" loading="lazy">
      </a>
      <nav class="footer-nav footer-game" aria-label="Game links">
        <div class="footer-actions">
          <a id="footer-play" href="#/play">Play Now <span aria-hidden="true">→</span></a>
        </div>
        <div class="footer-directory">
          <a href="#/updates">New Updates</a>
          <a href="#/guide">Guide</a>
          <a href="#/donate">Donate</a>
        </div>
      </nav>
      <nav class="footer-nav footer-community" aria-label="Community links">
        <div class="footer-actions">
          <a href="#/forums">Forums <span aria-hidden="true">→</span></a>
        </div>
        <div class="footer-directory">
          <a href="#/community">Community Posts</a>
          <a href="#/members">Members</a>
          <a href="#/rules">Rules</a>
        </div>
      </nav>
    </div>
    <div class="container footer-bottom">
      <small>© <span id="year"></span> Shadow of Death</small>
    </div>
  </footer>

  <div id="chatbar" class="chatbar"></div>
  <div id="toasts" class="toasts"></div>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/backend-supabase.js"></script>
  <script src="js/backend-demo.js"></script>
  <script src="js/messenger.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/donate.js"></script>
  <script src="js/updates.js"></script>
  <script src="js/patchbook.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
